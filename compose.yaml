name: tauceti-worker

x-tauceti-logging: &tauceti-logging
  # Docker's local driver rotates and compresses its private log files.  Three 10 MiB segments bound
  # each service at roughly 30 MiB without relying on an external cron job touching Docker internals.
  driver: local
  options:
    max-size: "10m"
    max-file: "3"

services:
  tauceti:
    build:
      context: .
    image: tauceti-worker:local
    init: true
    restart: unless-stopped
    logging: *tauceti-logging
    stop_grace_period: 2m
    command: ["./tauceti", "work", "--loop"]
    environment:
      TAUCETI_WORKER_ID: docker
      TAUCETI_WORKER_ARGS: "${TAUCETI_WORKER_ARGS:-}"
      # Set TAUCETI_PACE in .env for a persistent custom quota curve. A --pace option in
      # TAUCETI_WORKER_ARGS remains authoritative when both are supplied.
      TAUCETI_PACE: "${TAUCETI_PACE:-}"
      # This deployment's Lean installation is dedicated to TauCeti worker checkouts.
      TAUCETI_PRUNE_OBSOLETE_LEAN_TOOLCHAINS: "true"
      # Low-space cleanup runs only between model rounds, before an agent can touch Lake outputs.
      TAUCETI_MIN_FREE_GIB: "${TAUCETI_MIN_FREE_GIB:-8}"
      TAUCETI_LOG_RETENTION_DAYS: "${TAUCETI_LOG_RETENTION_DAYS:-14}"
      TAUCETI_LOG_MAX_MIB: "${TAUCETI_LOG_MAX_MIB:-256}"
    volumes:
      # Access-only agent credentials and GitHub authentication. Claude's mirror is writable because
      # the worker keeps its shared quota-bootstrap ledger beside it; the renewable credential remains
      # isolated in the separate `claude` volume.
      - claude-worker:/root/.claude
      - codex-worker:/root/.codex:ro
      - gh:/root/.config/gh
      # Preserve build downloads and the checkout-selected Lean toolchain across image or container
      # replacement. Elan's executables remain image-owned so updates cannot be hidden by this volume.
      - uv-cache:/root/.cache/uv
      - elan-toolchains:/opt/elan/toolchains
      # Checkouts, scheduler state, and durable per-round logs.
      - checkouts:/opt/tauceti/checkouts
      - state:/opt/tauceti/state
      - logs:/opt/tauceti/logs

  # Explicit setup runner: unlike the worker, this service mounts credentials read-write.
  # Run it only for the documented one-time login commands, never as a long-running service.
  auth:
    image: tauceti-worker:local
    profiles: [setup]
    stdin_open: true
    tty: true
    logging: *tauceti-logging
    command: ["bash"]
    environment:
      TAUCETI_SKIP_GIT_IDENTITY: "1"
    volumes:
      - claude:/root/.claude
      - codex:/root/.codex
      - gh:/root/.config/gh

  # These are the only processes allowed to rotate each provider's shared refresh token.
  # TauCeti's isolated worker home mirrors their access tokens, avoiding refresh-token races.
  claude-refresh:
    image: tauceti-worker:local
    init: true
    restart: unless-stopped
    logging: *tauceti-logging
    # Exceed the refresher's 15-second HTTP timeout so Docker cannot kill it after
    # the server rotates a token but before the replacement is persisted.
    stop_grace_period: 60s
    command: ["/usr/local/bin/tauceti-oauth-refresh", "claude"]
    environment:
      TAUCETI_SKIP_GIT_IDENTITY: "1"
      TAUCETI_REFRESH_MIRROR: /worker-credentials/.credentials.json
    volumes:
      - claude:/root/.claude
      - claude-worker:/worker-credentials

  codex-refresh:
    image: tauceti-worker:local
    init: true
    restart: unless-stopped
    logging: *tauceti-logging
    stop_grace_period: 60s
    command: ["/usr/local/bin/tauceti-oauth-refresh", "codex"]
    environment:
      TAUCETI_SKIP_GIT_IDENTITY: "1"
      TAUCETI_REFRESH_MIRROR: /worker-credentials/auth.json
    volumes:
      - codex:/root/.codex
      - codex-worker:/worker-credentials

volumes:
  claude:
  codex:
  claude-worker:
  codex-worker:
  gh:
  uv-cache:
  elan-toolchains:
  checkouts:
  state:
  logs:
